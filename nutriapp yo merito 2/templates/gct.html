{% extends "base.html" %}
{% block content %}
<h2>Calculadora de Grasa Corporal</h2>

<form method="POST">
    <input type="number" name="cintura" placeholder="Medida de cintura (cm)">
    <input type="number" name="peso" placeholder="Peso (kg)">
    <select name="sexo">
        <option value="hombre">Hombre</option>
        <option value="mujer">Mujer</option>
    </select>
    <button type="submit">Calcular</button>
</form>

{% if grasa %}
<p>Tu porcentaje de grasa corporal es: {{ grasa }}%</p>
{% endif %}

{% endblock %}
