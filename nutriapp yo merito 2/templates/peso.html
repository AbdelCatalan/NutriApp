{% extends "base.html" %}

{% block content %}
<h2>Peso Ideal</h2>

<form method="POST">
    <input type="number" name="altura" placeholder="Altura (cm)" required>
    <button type="submit">Calcular</button>
</form>

{% if peso_ideal %}
<p><strong>Tu peso ideal es:</strong> {{ peso_ideal }} kg</p>
{% endif %}
{% endblock %}
