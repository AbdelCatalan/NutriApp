{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Calculadora de Índice de Masa Corporal (IMC)</h2>

    <form method="POST" action="/imc" class="mt-3">
        <div class="mb-3">
            <label>Peso (kg)</label>
            <input type="number" step="0.01" name="peso" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Altura (m)</label>
            <input type="number" step="0.01" name="altura" class="form-control" required>
        </div>

        <button class="btn btn-primary">Calcular</button>
    </form>

    {% if resultado %}
    <div class="alert alert-info mt-3">
        Tu IMC es: <strong>{{ resultado }}</strong>
    </div>
    {% endif %}
</div>
{% endblock %}
