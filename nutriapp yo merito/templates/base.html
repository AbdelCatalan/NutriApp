<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}NutriApp{% endblock %}</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;

        background: url("/static/img/Fondo.png") repeat;
        background-size: auto; 
    }

    nav {
        background: rgba(255, 255, 255, 0.85);
        padding: 10px;
        text-align: center;
        backdrop-filter: blur(4px);
    }

    nav a {
        margin: 0 10px;
        text-decoration: none;
        font-weight: bold;
        color: #1a4d2e;
    }

    .container {
        width: 90%;
        max-width: 450px;
        margin: 40px auto;
        background: rgba(255, 255, 255, 0.92);
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 0 15px rgba(0,0,0,0.3);
        backdrop-filter: blur(4px);
    }
</style>

</head>

<body>
    <nav>
        <a href="/">Inicio</a>
        <a href="/registro">Registro</a>
        <a href="/login">Iniciar sesion</a>
        <a href="/educacion">Educacion</a>
        <a href="/recetas">Recetas</a>
        <a href="/herramientas">Herramientas</a>
        <a href="/macro">Macros</a>
        <a href="/peso">Peso Ideal</a>
        <a href="/imc">IMC</a>
        <a href="/gct">GCT</a>
        <a href="/tmb">TMB</a>

    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
  
<body style="background-image: url('static/Fondo.png'); background-repeat: repeat;">
</body>

  
</body>
</html>
